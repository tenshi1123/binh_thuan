  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.3
  easy_splash_screen: ^1.0.4
  provider: ^6.1.2
  flutter_bloc: ^8.1.5
  # firebase_core: ^3.1.1
  # cloud_firestore: ^5.0.2
  # firebase_auth: ^5.0.0

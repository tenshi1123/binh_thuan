  flutter_svg: ^2.0.10+1
  card_swiper: ^3.0.1
  smooth_page_indicator: ^1.1.0
  sp_util: ^2.0.3
  #notifications
  flutter_local_notifications: ^17.1.2
  flutter_timezone: ^1.0.8
  rxdart: ^0.27.7
  tab_container: ^3.5.3
